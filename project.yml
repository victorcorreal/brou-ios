# The Xcode project is made from this file: `xcodegen generate`.
# Search for iPhone, iPad and iPhone Duo: Victor's companion to his build of
# Search for Mac, with bookmarks and passwords shared through iCloud.
name: Search
options:
  bundleIdPrefix: cat.correal
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: E653G759EN
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1792582963"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Search:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # A browser goes wherever it is pointed, plain http included.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        # Apple asks a browser to claim web links before it can be the
        # default one, and only the default browser opens Home Screen bookmarks.
        CFBundleURLTypes:
          - CFBundleURLName: cat.correal.search.web
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
    entitlements:
      path: Search.entitlements
      properties:
        # Approved by Apple for cat.correal.search on 20 October 2026.
        com.apple.developer.web-browser: true
        # The same container and keychain group as Search for Mac
        # (see SINCRONIZACION.md in Victor's Mac/Search folder).
        com.apple.developer.icloud-container-identifiers: [iCloud.cat.correal.search]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-environment: Development
        keychain-access-groups: ["$(AppIdentifierPrefix)cat.correal.search"]
    settings:
      base:
        PRODUCT_NAME: Brou
        PRODUCT_BUNDLE_IDENTIFIER: cat.correal.search
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Brou
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Brou shows a saved password only after Face ID."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
